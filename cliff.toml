[changelog]
header = ""
body = """
{% if version %}\
## What's Changed in {{ version }}
{% else %}\
## What's Changed
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^[Ff]eat", group = "Features" },
    { message = "^[Aa]dd", group = "Features" },
    { message = "^[Ss]upport", group = "Features" },
    { message = "^[Ii]mplement", group = "Features" },
    { message = "^[Ff]ix", group = "Bug Fixes" },
    { message = "^[Ss]witch", group = "Refactoring" },
    { message = "^[Rr]eplace", group = "Refactoring" },
    { message = "^[Rr]efactor", group = "Refactoring" },
    { message = "^[Rr]edesign", group = "Styling & UI" },
    { message = "^[Ss]tyle", group = "Styling & UI" },
    { message = "^[Dd]oc", group = "Documentation" },
    { message = "^[Pp]erf", group = "Performance" },
    { message = "^[Tt]est", group = "Testing" },
    { message = "^[Bb]ump", skip = true },
    { message = "^[Cc]hore\\(release\\)", skip = true },
    { message = "^[Cc]hore", group = "Miscellaneous Tasks" },
    { body = ".*security", group = "Security" },
    { message = ".*", group = "Other Changes" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v?[0-9].*"
sort_commits = "oldest"
