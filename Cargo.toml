[package]
name = "pixora"
version = "0.16.0"
edition = "2024"
authors = ["Onzi"]
description = "Pixora - Screen Capture & Annotation"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
chrono = "0.4"
smallvec = "1.13"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_Security",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation_Collections",
    "Globalization",
]
