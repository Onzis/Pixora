[package]
name = "pixora"
version = "0.22.1"
edition = "2024"
authors = ["Onzi"]
description = "Pixora - Screen Capture & Annotation"
license = "Apache-2.0"
build = "build.rs"

[lib]
name = "pixora"
path = "src/lib.rs"

[[bin]]
name = "Pixora"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "6.0"
chrono = "0.4"
smallvec = "1.13"
raw-window-handle = "0.6"
rqrr = "0.11"
rxing = { version = "0.9.4", default-features = false, features = ["qrcode", "oned", "datamatrix", "image", "encoding_rs", "decoders", "encoders"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
]

[target.'cfg(target_os = "linux")'.dependencies]
x11-clipboard = "0.9"
x11rb = { version = "0.13", features = ["allow-unsafe-code", "shm", "randr"] }

[patch.crates-io]
xattr = { path = "patches/xattr" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
