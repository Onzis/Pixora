name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    name: Test Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets

      - name: Run Tests
        run: cargo test --all-targets

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc

  test-linux:
    name: Test Linux (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libvulkan-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            libdbus-1-dev \
            libx11-xcb-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            xvfb \
            tesseract-ocr \
            tesseract-ocr-rus \
            wl-clipboard \
            xclip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets

      - name: Run Tests (under Xvfb)
        run: xvfb-run --auto-servernum cargo test --all-targets

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu
