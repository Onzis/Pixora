name: Release Build and Packaging

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets

      - name: Run Tests
        run: cargo test --all-targets

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate Changelog with git-cliff
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --config cliff.toml --verbose --latest --output RELEASE_NOTES.md
          if (-not (Test-Path "RELEASE_NOTES.md") -or (Get-Item "RELEASE_NOTES.md").Length -eq 0) {
            "Release $env:GITHUB_REF_NAME" | Out-File -FilePath "RELEASE_NOTES.md" -Encoding utf8
          }

      - name: Package Release Archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v0.19.1" }
          $distDir = "dist/Pixora-$tag-x86_64-windows"
          New-Item -ItemType Directory -Force -Path $distDir
          Copy-Item "target/x86_64-pc-windows-msvc/release/Pixora.exe" -Destination "$distDir/Pixora.exe"
          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" -Destination "$distDir/LICENSE"
          }
          if (Test-Path "README.md") {
            Copy-Item "README.md" -Destination "$distDir/README.md"
          }
          Compress-Archive -Path "$distDir/*" -DestinationPath "Pixora-$tag-windows-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          files: |
            target/x86_64-pc-windows-msvc/release/Pixora.exe
            Pixora-*-windows-x64.zip
          draft: false
          prerelease: false
