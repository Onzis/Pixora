name: Release Build and Packaging

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets

      - name: Run Tests
        run: cargo test --all-targets

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows Archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v0.22.0" }
          $distDir = "dist/Pixora-$tag-x86_64-windows"
          New-Item -ItemType Directory -Force -Path $distDir
          Copy-Item "target/x86_64-pc-windows-msvc/release/Pixora.exe" -Destination "$distDir/Pixora.exe"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "$distDir/LICENSE" }
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "$distDir/README.md" }
          Compress-Archive -Path "$distDir/*" -DestinationPath "Pixora-$tag-windows-x64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            target/x86_64-pc-windows-msvc/release/Pixora.exe
            Pixora-*-windows-x64.zip

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libvulkan-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            libdbus-1-dev \
            libx11-xcb-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            xvfb \
            tesseract-ocr \
            tesseract-ocr-rus \
            wl-clipboard \
            xclip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets

      - name: Run Tests (under Xvfb)
        run: xvfb-run --auto-servernum cargo test --all-targets

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux Archive
        run: |
          TAG="${GITHUB_REF_NAME:-v0.22.0}"
          DIST_DIR="dist/Pixora-${TAG}-x86_64-linux"
          mkdir -p "${DIST_DIR}"
          cp target/x86_64-unknown-linux-gnu/release/Pixora "${DIST_DIR}/pixora"
          chmod +x "${DIST_DIR}/pixora"
          [ -f "assets/pixora.desktop" ] && cp "assets/pixora.desktop" "${DIST_DIR}/"
          [ -f "assets/pixora_icon_256.png" ] && cp "assets/pixora_icon_256.png" "${DIST_DIR}/pixora.png"
          [ -f "LICENSE" ] && cp "LICENSE" "${DIST_DIR}/"
          [ -f "README.md" ] && cp "README.md" "${DIST_DIR}/"
          tar -czvf "Pixora-${TAG}-linux-x64.tar.gz" -C dist "Pixora-${TAG}-x86_64-linux"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            target/x86_64-unknown-linux-gnu/release/Pixora
            Pixora-*-linux-x64.tar.gz

  publish-release:
    name: Publish Release to GitHub
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets/linux

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate Changelog with git-cliff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --config cliff.toml --verbose --latest --output RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/windows/Pixora.exe
            release-assets/windows/Pixora-*-windows-x64.zip
            release-assets/linux/Pixora
            release-assets/linux/Pixora-*-linux-x64.tar.gz
          draft: false
          prerelease: false
